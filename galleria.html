<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A visual archive of Parthajit Das’s academic, campus, and personal events.">
    <meta name="theme-color" content="#f5f3ee">
    <title>Galleria — Parthajit Das</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page light-mode">
    <a class="skip-link" href="#gallery-main">Skip to gallery</a>
    <header class="gallery-topbar">
        <a class="gallery-home-btn" href="index.html#home">← Portfolio</a>
<button id="galleryThemeToggle" class="gallery-theme-toggle" type="button" aria-label="Switch to dark mode">☾</button>
    </header>
    <main id="gallery-main" class="gallery-container">
        <h1 class="gallery-title">Galleria<span>Places, people, and moments along the way.</span></h1>
        <div id="galleryWrapper" aria-live="polite"><p class="content-state" role="status">Loading the gallery…</p></div>
    </main>
    <div id="imageModal" class="image-modal" role="dialog" aria-modal="true" aria-label="Photo preview" aria-hidden="true">
        <button class="close-btn" type="button" aria-label="Close photo preview">&times;</button>
        <img id="modalImage" alt="Expanded gallery photograph">
    </div>
    <script type="module" src="gallery.js"></script>
</body>
</html>
